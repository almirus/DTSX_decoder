name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        run: python .github/scripts/set-version.py

      - name: Build release
        shell: cmd
        run: call build.bat

      - name: Check CLI
        shell: pwsh
        run: |
          $versionOutput = & .\bin\Release\dtsx-decode.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
          $versionOutput
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $versionOutput[0] -cne "dtsx-decode $($env:GITHUB_REF_NAME.Substring(1))") {
            throw 'Compiled version does not match the release tag'
          }
          & .\bin\Release\dtsx-decode.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Help check failed' }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item bin/Release/dtsx-decode.exe, README.md, LICENSE package/
          Copy-Item third_party/dcadec/COPYING.LGPLv2.1 package/
          Get-Content third_party/qrcodegen/qrcodegen.hpp -TotalCount 22 | Set-Content package/LICENSE.qrcodegen.txt
          Compress-Archive -Path package/* -DestinationPath dtsx-decode-windows-x64.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dtsx-decode-windows-x64
          path: dtsx-decode-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x64 (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        run: python3 .github/scripts/set-version.py

      - name: Build release
        run: ./build.sh

      - name: Check CLI
        run: |
          version_output=$(./bin/Release/dtsx-decode --version)
          printf '%s\n' "$version_output"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$(printf '%s\n' "$version_output" | head -n 1)" = "dtsx-decode ${GITHUB_REF_NAME#v}"
          fi
          ./bin/Release/dtsx-decode --help

      - name: Package
        run: |
          mkdir package
          cp bin/Release/dtsx-decode README.md LICENSE third_party/dcadec/COPYING.LGPLv2.1 package/
          head -n 22 third_party/qrcodegen/qrcodegen.hpp > package/LICENSE.qrcodegen.txt
          tar -czf dtsx-decode-linux-x64-${{ matrix.compiler }}.tar.gz -C package .

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dtsx-decode-linux-x64-${{ matrix.compiler }}
          path: dtsx-decode-linux-x64-${{ matrix.compiler }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: dtsx-decode-*
          merge-multiple: true
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --title "DTSX ${RELEASE_TAG#v}" --generate-notes)
          version=${RELEASE_TAG#v}
          if [[ "${version%%+*}" == *-* ]]; then
            args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* "${args[@]}"
          fi
